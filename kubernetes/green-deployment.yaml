apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-app
  labels:
    app: green-app
    environment: green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: green-app
      environment: green

  template:
    metadata:
      labels:
        app: green-app
        environment: green

    spec:
      containers:
        - name: green-app
          image: blue-green-app:green

          ports:
            - containerPort: 8080

          env:
            - name: APP_VERSION
              value: "green"
